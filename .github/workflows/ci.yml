name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos, tests, datos y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `pdftotext` (poppler) lo necesita la prueba de idempotencia de los ETL de PDF (Fase 5-A3). Si no se
      # puede instalar, esa prueba se omite (no falla el CI) y el resto de comprobaciones de los datos siguen.
      - name: Instalar poppler-utils (si falta)
        timeout-minutes: 2
        continue-on-error: true
        run: command -v pdftotext || sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Lint (ESLint, Prettier, estilos y contraste)
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Tests unitarios
        run: npm test
      - name: Validación de datos
        run: npm run validate:data
      - name: Compilación
        run: npm run build

  interfaz:
    name: Interfaz (Playwright)
    runs-on: ubuntu-latest
    # El recorrido completo de Playwright (escritorio y móvil) ya tardaba cerca de 19 minutos con el
    # límite anterior de 20; se amplía para que no dependa de un plazo ajustado.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sin --with-deps: la imagen del ejecutor ya trae las librerías de Chromium y apt-get puede no
      # resolver los espejos de Ubuntu (el paso fallaba tras ~10 min solo por instalar fuentes CJK).
      - name: Instalar Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Pruebas de interfaz
        run: npm run test:e2e
      - name: Capturas (1360 px y 390 px)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas/
          if-no-files-found: ignore
      - name: Informe de Playwright
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7
